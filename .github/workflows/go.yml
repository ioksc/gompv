name: Go Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y mpv

      - name: Vet
        run: go vet ./...

      - name: Run unit & integration tests with race detector
        run: go test -v -race ./...

      - name: Build
        run: go build ./...
